# Checks every pull request before it can be merged: tests, lint and the
# typecheck/build. It never deploys; deploy.yml does that after the merge.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # main's branch protection requires a passing check with this exact name.
    name: Tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches local development.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
